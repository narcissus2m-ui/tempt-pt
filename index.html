<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TEMPT PT 가이드</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<meta name="apple-mobile-web-app-title" content="TEMPT">
<meta name="application-name" content="TEMPT">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0F1214">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:wght@500;600&family=Noto+Serif+KR:wght@500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 모바일 한 화면 앱 — 로고 헤더, 스크롤 본문, 문서 흐름 안의 하단 탭바.
   톤: TEMPT 로고 — 매트 차콜 위 메탈릭 골드 라인, 클래식 세리프. 다크 단일 테마(의도적) */
:root{
  color-scheme:dark;
  --bg:#0F1214; --surface:#161A1D; --sunk:#1E2327; --fg:#ECE6D8; --muted:#9A968C; --line:rgba(212,175,95,.16);
  --gold:#D4AF5F; --gold-hi:#F3DFA2; --gold-lo:#8C6A2B;
  --accent:#D4AF5F; --accent-soft:rgba(212,175,95,.14); --on-accent:#141210;
  --grad:linear-gradient(135deg,#F3DFA2 0%,#D4AF5F 45%,#A07A34 100%);
  --glow:0 0 18px rgba(212,175,95,.18);
  --z1:#8C9096; --z2:#7FA88E; --z3:#D9B663; --z4:#C9824C; --z5:#B44A40; --on-z:#0E0F10;
  --ok:#7FA88E; --warn-bg:rgba(201,130,76,.14); --warn-fg:#E8B48A;
  --f-display:"Cinzel","Noto Serif KR",Georgia,serif;
  --f-serif:"Noto Serif KR","Cormorant Garamond",Georgia,serif;
  --f-num:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
html,body{height:100%}
body{background:radial-gradient(120% 60% at 50% 0%,#1A1F23 0%,var(--bg) 60%) fixed,var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;word-break:keep-all;overflow-wrap:break-word}
*{box-sizing:border-box}
button,select,input,textarea,a,summary{touch-action:manipulation;-webkit-tap-highlight-color:transparent;font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#root{height:100%}
.app{height:100%;max-width:600px;margin:0 auto;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--bg)}
.brand{white-space:nowrap;display:flex;align-items:center;gap:10px}
.mark{width:46px;height:auto;display:block;filter:drop-shadow(0 0 6px rgba(212,175,95,.5))}
.wm{display:flex;flex-direction:column;line-height:1}
.wm b{font-family:var(--f-display);font-weight:600;font-size:28px;letter-spacing:.14em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.wm small{font-family:var(--f-display);font-size:11px;letter-spacing:.32em;color:var(--gold);margin-top:4px}
@media (max-width:480px){.mark{width:38px}.wm b{font-size:23px}.wm small{font-size:9.5px;letter-spacing:.26em}.brand{gap:8px}}
@media (max-width:360px){.mark{width:32px}.wm b{font-size:19px;letter-spacing:.1em}.wm small{font-size:8px;letter-spacing:.2em}.brand{gap:6px}.top .row{gap:4px}.top .who{max-width:96px}}
.top>.row{min-width:0}.top .who{min-width:0}



.row{display:flex;align-items:center;gap:8px}.row.wrap{flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1;min-width:0}
.who{max-width:120px}
.icon{width:34px;height:34px;border-radius:50%;border:1px solid var(--gold-lo);background:transparent;color:var(--gold);font-family:var(--f-display);font-weight:600;cursor:pointer}
.addbar,.notice{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-block:8px;border-bottom:1px solid var(--line);color:var(--muted);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:#12161A;font-size:12.5px}
.addbar input{flex:1;min-width:0}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer;font-size:inherit}
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:14px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--line);background:#0B0D0F;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;background:none;border:0;color:var(--muted);font-size:11.5px;cursor:pointer}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round}
.nav button.on{color:var(--gold-hi);font-weight:700}
.nav button.on svg{filter:drop-shadow(0 0 5px rgba(212,175,95,.6))}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid2.tight{gap:10px;margin-bottom:10px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.card{background:linear-gradient(180deg,#181C1F,#14171A);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
.card.tap{cursor:pointer}.card.tap:active{background:var(--sunk)}
.card.editing{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card.feature{border-color:var(--gold-lo);box-shadow:var(--glow),inset 0 1px 0 rgba(243,223,162,.12)}
.card-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 8px;margin-bottom:10px}
.card-h>:not(h3):last-child{margin-left:auto;min-width:0;text-align:right}
.card-h h3{margin:0;font-family:var(--f-serif);font-size:14.5px;font-weight:600;letter-spacing:.02em;color:var(--gold)}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:4px 0 2px}
.hero h2{margin:0;font-family:var(--f-serif);font-weight:600;font-size:26px;text-wrap:balance}
.hero{border-bottom:1px solid var(--line);padding-bottom:12px!important}
.eyebrow{margin:0;font-size:11.5px;letter-spacing:.18em;color:var(--gold);font-weight:500}
.big{margin:0;font-family:var(--f-num);font-weight:600;font-size:44px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;width:fit-content;line-height:1.05;font-variant-numeric:tabular-nums}
.big small{font-family:var(--f-body);font-size:13px;font-weight:500;-webkit-text-fill-color:var(--muted);color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:12.5px}
p{margin:4px 0}
.kv3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kv3>div{display:flex;flex-direction:column;padding:8px;border-radius:4px;background:rgba(255,255,255,.025);border:1px solid rgba(212,175,95,.08);min-width:0}
.kv3>div.pick{background:var(--accent-soft);border-color:var(--gold-lo);display:flex;gap:0;margin-top:0}
.kv3 b{font-family:var(--f-num);font-weight:600;color:var(--fg);font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.kv3 span{font-size:11.5px;color:var(--muted);line-height:1.35}
.macro-row{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-block;padding:3px 9px;border-radius:999px;background:var(--sunk);font-size:12px;white-space:nowrap}
.chip.ok{background:transparent;border:1px solid var(--ok);color:var(--ok)}
.chip.wait{background:transparent;border:1px solid rgba(201,130,76,.55);color:#E2B08B}
.zstrip{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;border-radius:8px;overflow:hidden}
.zstrip>div{padding:6px 4px;color:var(--on-z);display:flex;flex-direction:column;align-items:center;font-variant-numeric:tabular-nums}
.zstrip b{font-family:var(--f-num);font-weight:700;font-size:15px}.zstrip span{font-size:11px}
.bar{height:7px;border-radius:4px;background:var(--sunk);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:4px}
.sline{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-top:1px solid var(--line);min-width:0}
.card .sline:first-of-type{border-top:0}
.sline .date{font-family:var(--f-num);font-weight:600;color:var(--gold);font-size:17px;width:44px;flex:none;font-variant-numeric:tabular-nums}
.sline .names{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:flex;flex-wrap:wrap;gap:4px;padding:3px;background:#0C0E10;border:1px solid var(--line);border-radius:6px}
.seg button{flex:1;padding:8px 10px;border:0;background:none;border-radius:4px;cursor:pointer;font-weight:500;white-space:nowrap;color:var(--muted)}
.seg button.on{background:var(--accent-soft);color:var(--gold-hi);font-weight:700;box-shadow:inset 0 0 0 1px var(--gold-lo)}
.seg.sm button{padding:5px 9px;font-size:12.5px}
@media (max-width:359px){.seg button{padding:8px 6px;font-size:13px}.seg.sm button{padding:5px 6px;font-size:12px}}
.form{display:grid;gap:10px;margin-bottom:12px}
.form.cols{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.field{display:flex;flex-direction:column;gap:4px;min-width:0;margin-bottom:8px}
.form .field{margin-bottom:0}
.field>span{font-size:12px;color:var(--muted);font-weight:500}
.field em{font-style:normal;font-size:11.5px;color:var(--muted)}
input,select,textarea{width:100%;min-width:0;padding:9px 10px;border:1px solid rgba(212,175,95,.2);border-radius:4px;background:#0C0E10;font-size:15px}
textarea{resize:vertical}
.btn{padding:10px 16px;border-radius:4px;border:0;background:var(--grad);color:var(--on-accent);font-weight:700;letter-spacing:.04em;box-shadow:var(--glow);cursor:pointer;white-space:nowrap}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold-lo);box-shadow:none}
.btn.small{padding:6px 10px;font-size:12.5px}
.btn.wide{width:100%;margin-top:12px}
.btn.danger{background:var(--z5);color:#fff;box-shadow:none}
.x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:4px 6px}
.cite{border:1px solid var(--gold-lo);background:transparent;font-family:var(--f-body);border-radius:999px;font-size:11.5px;padding:3px 9px;cursor:pointer;color:var(--accent);font-weight:700;white-space:nowrap}
.src-row{flex-wrap:wrap;margin-bottom:10px}
.src{display:inline-flex;align-items:center;gap:6px;border:1px dashed rgba(212,175,95,.3);background:transparent;border-radius:6px;padding:4px 8px;font-size:12px;cursor:pointer;text-align:left}
.src .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
.tbl-wrap{overflow-x:auto;margin-top:4px}
.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:500;padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tr.hl td{background:var(--accent-soft)}
.tbl.rest td{white-space:normal;vertical-align:top}
.tbl.rest td small{display:block;color:var(--muted);font-size:11.5px;margin-bottom:2px}
.tbl.rest td b{font-weight:600}
.band{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11.5px;font-weight:700;color:var(--on-z)}
.band.s1{background:var(--z5)}.band.s2{background:var(--z3)}.band.s3{background:var(--z2)}
.warn{background:var(--warn-bg);color:var(--warn-fg);padding:6px 9px;border-radius:6px;margin-top:8px}
li.warn{list-style:none;margin-left:-18px}
.entry{border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:10px}
.entry-h{display:flex;align-items:center;gap:8px}.entry-h b{flex:1;min-width:0}
.sets-h,.sets{display:grid;grid-template-columns:28px 1fr 1fr 64px 28px;gap:6px;align-items:center;margin-top:6px}
.sets-h span{font-size:11px;color:var(--muted)}
.sets input,.sets select{padding:7px 8px}
.sess{border-top:1px solid var(--line);padding:2px 0}
.sess summary{list-style:none;cursor:pointer}.sess summary::-webkit-details-marker{display:none}
.sess[open]{padding-bottom:8px}
.sess .sline{border-top:0}
.zt{display:inline-block;padding:0 6px;border-radius:3px;color:var(--on-z);font-weight:700;font-size:11.5px;font-family:var(--f-num);letter-spacing:.04em}
.zone{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line)}.zone:first-child{border-top:0}
.zbadge{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--on-z);font-family:var(--f-num);font-weight:700;font-size:15px;box-shadow:0 0 10px rgba(0,0,0,.4)}
.zbody{flex:1;min-width:0}
.zrow{display:flex;align-items:center;gap:8px;margin-top:6px}.zrow .bar{margin-top:0}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.week>div{background:var(--sunk);border-radius:6px;padding:6px 4px;min-width:0}
.week span{font-weight:700;font-size:12px}.week p{margin:2px 0 0;font-size:11px;line-height:1.3;word-break:keep-all}
@media (max-width:420px){.week{grid-template-columns:repeat(4,1fr)}}
.dstyles{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.dstyle{display:flex;flex-direction:column;gap:6px;text-align:left;padding:10px 12px;border-radius:4px;border:1px solid var(--line);background:rgba(255,255,255,.02);cursor:pointer}
.dstyle.on{border-color:var(--gold-lo);background:var(--accent-soft);box-shadow:var(--glow)}
.dstyle b{font-family:var(--f-serif);color:var(--gold-hi)}
.stackbar{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--sunk)}
.stackbar i{display:block;height:100%}
.macros{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.rgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.rcell{border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.rsub span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcell.ok{border-color:color-mix(in srgb,var(--ok) 50%,var(--line))}
.spark{width:100%;height:44px;display:block}
.danger-zone{display:flex;justify-content:flex-end}
.sheet{position:fixed;inset:0;z-index:20;background:#0D1012;display:flex;flex-direction:column;max-width:600px;margin:0 auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.sheet-b{flex:1;overflow-y:auto;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.refs{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px;font-size:12.5px;max-width:65ch}
.code{background:var(--sunk);padding:10px;border-radius:8px;font-size:11.5px;overflow-x:auto;margin:0;font-family:ui-monospace,Menlo,Consolas,monospace}
.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.flow>div{border:1px solid var(--gold-lo);border-radius:8px;padding:8px;display:flex;flex-direction:column;min-width:0}
.flow span{font-size:11px;color:var(--muted)}
.foot{font-size:11.5px;color:var(--muted);margin-top:18px;text-align:center}
/* 로그인 · 서버 저장 */
.pill{display:inline-block;padding:2px 8px;border-radius:999px;border:1px solid var(--gold-lo);color:var(--muted);font-size:11.5px;white-space:nowrap}
.pill.ok{border-color:var(--ok);color:var(--ok)}
.pill.bad{border-color:var(--z5);color:#E58C82}
.errtxt{color:#E58C82}
.center{text-align:center;justify-content:center}
.authwrap{max-width:420px;margin:0 auto;padding-top:8px}
.icon.acct{position:relative;display:grid;place-items:center}
.icon.acct svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8}
.icon.acct::after{content:"";position:absolute;right:0;top:0;width:8px;height:8px;border-radius:50%;background:var(--muted);border:2px solid var(--bg)}
.icon.acct.ok::after{background:var(--ok)}.icon.acct.busy::after{background:var(--gold)}.icon.acct.bad::after{background:var(--z5)}
.invite{display:flex;align-items:baseline;gap:10px;margin:0 0 6px}
.invite b{font-family:var(--f-num);font-size:30px;letter-spacing:.18em;color:var(--gold-hi)}
.addbar.flat{border:0;padding:6px 0}
.notice.bad{color:#E58C82}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* admin-cal */
.exrow{border-top:1px solid var(--line)}.exrow .mrow{border-top:0}
.exrow.open{background:rgba(212,175,95,.05)}
.exedit{padding:4px 4px 14px;display:grid;gap:10px}
.exfilter{margin:6px 0}.exfilter select{width:auto;flex:1}
.tag.eq{margin-left:6px;border-color:var(--gold-lo);color:var(--gold-hi)}
.chip.tog:disabled{opacity:.35;cursor:not-allowed}
/* 1rm-strip */
.exstrip{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 0 10px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;cursor:grab;user-select:none;scrollbar-width:thin}
.exstrip:active{cursor:grabbing}
.exchip{flex:0 0 auto;scroll-snap-align:start;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:104px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--sunk);color:var(--fg);cursor:pointer;text-align:left;font:inherit}
.exchip b{font-size:13px;font-weight:600;white-space:nowrap}
.exchip small{font-size:11.5px;color:var(--gold-hi)}
.exchip.none small{color:var(--muted)}
.exchip.none b{color:var(--muted)}
.exchip.on{border-color:var(--gold-lo);background:var(--accent-soft)}
.exchip.on b{color:var(--gold-hi)}
.exchip .fv{color:var(--gold)}
.calc-opts{display:grid;gap:12px}
.check{display:flex;align-items:center;gap:8px;flex-wrap:wrap;cursor:pointer;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--gold);margin:0}
.check em{font-style:normal;flex-basis:100%;margin-left:28px;margin-top:-4px}
/* date-fix: iOS 날짜·시간 칸이 옆 칸을 침범하지 않게 */
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;max-width:100%;min-height:42px;text-align:left}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:left;margin:0}
.form.cols{column-gap:14px;row-gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.form.cols .field{min-width:0;overflow:hidden}
@media (max-width:480px){.form.cols .field:has(input[type=date]){grid-column:1/-1}}
.btn.logout{margin-top:12px;background:transparent;color:var(--gold-hi);border:1px solid var(--gold-lo);box-shadow:none}
.st-cls .sline .date{white-space:nowrap;min-width:auto;font-size:13px}
.staffedit .field{margin-top:12px}
.calc-opts .field em{display:block;margin-top:6px}
.exhead{display:flex;align-items:center;gap:4px}
.exhead .mrow{flex:1;min-width:0}
.star{flex:0 0 auto;width:36px;height:36px;border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer;border-radius:50%}
.star.on{color:var(--gold-hi)}
.star:hover{background:var(--sunk)}
.demo{border:1px dashed var(--gold-lo);border-radius:6px;padding:8px 10px;margin:8px 0}

.btn.back{align-self:flex-start;margin-bottom:-4px}
.card .mbrowser .search{margin-top:0}
button.who{display:inline-flex;align-items:center;gap:4px;max-width:150px;min-width:0;padding:8px 8px 8px 12px;border:1px solid var(--line);border-radius:6px;background:#0C0E10;color:inherit;font-size:15px;cursor:pointer}
button.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
button.who svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2}
.mlist{list-style:none;margin:8px 0 0;padding:0}
.mrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 4px;color:inherit;cursor:pointer}
.mrow .mname{font-size:16px;font-weight:700}
.mrow .mlast{grid-column:2;grid-row:1;align-self:center}
.exhead .mrow{grid-template-columns:minmax(0,1fr)}.exhead .mrow .mlast{grid-column:1;grid-row:3;align-self:start;margin-top:2px}
.mrow.on{background:var(--accent-soft)}.mrow.on .mname{color:var(--gold-hi)}

.savebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.row.nowrap{flex-wrap:nowrap}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:10px}
.cal-wd{text-align:center;font-size:11.5px;color:var(--muted);padding:2px 0}.cal-wd.sun{color:#E58C82}.cal-wd.sat{color:#8FB3D9}
.cal-d{position:relative;min-width:0;overflow:hidden;min-height:52px;border:1px solid var(--line);border-radius:6px;background:transparent;color:inherit;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:4px 0 2px;cursor:pointer;font-size:13px}
.cal-d .n{line-height:1.2}
.cal-d.has{background:var(--accent-soft)}
.cal-d.today .n{color:var(--gold-hi);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.cal-d.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cal-d .t{font-size:10px;color:var(--muted);margin-top:auto;letter-spacing:-.2px}
.cmark{display:inline-flex;align-items:center;justify-content:center;min-width:9px;height:9px;border-radius:999px;border:1.5px solid var(--accent);font-size:9px;line-height:1;color:var(--on-accent);margin-top:2px;vertical-align:middle}
.cmark.pt{background:var(--accent)}
.cal-d .cmark:not(:empty){min-width:14px;height:14px;padding:0 3px;font-weight:700}
.cal-d .cmark:not(.pt):not(:empty){color:var(--accent)}
.cmark:empty{width:9px;max-width:9px;flex:none;padding:0}
.legend{margin-top:8px}.legend .cmark{margin:0 3px 0 6px}
.tag{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11.5px;border:1px solid var(--line);color:var(--muted)}
.tag.pt{border-color:var(--gold-lo);color:var(--gold-hi)}
.tag.src{margin-left:6px}
.tag.lock{margin-left:6px;border-color:var(--z5);color:var(--z5)}
.tag.by{margin-right:6px;font-size:10.5px;padding:0 5px}.tag.by.me{border-color:var(--gold-lo);color:var(--gold-hi)}
.pubwrap{display:inline-flex;align-items:center;gap:4px;margin-left:8px}
.pubtog{background:none;border:1px solid var(--line);border-radius:6px;padding:1px 5px;font-size:12px;line-height:1.3;cursor:pointer;color:inherit;margin-right:4px}
.pubtog.off{border-color:var(--z5)}
.cmark.priv{border-color:var(--muted);border-style:dashed}
.private-row td,.private-row p{font-style:italic}
td.nowrap{white-space:nowrap}
.clist{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:6px}
.clist li{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.clist li p{flex-basis:100%;margin:0}
.top{position:relative}
.actchip{display:inline-flex;align-items:center;gap:4px;background:none;border:1px solid var(--gold-lo);color:var(--gold);border-radius:999px;padding:4px 8px 4px 10px;font-size:12px;max-width:170px;cursor:pointer}.actchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.actchip i{font-style:normal;font-size:10px;flex:none}
.mmenu-bg{position:fixed;inset:0;z-index:40}
.mmenu{position:absolute;right:12px;top:calc(100% + 4px);z-index:41;min-width:230px;max-width:calc(100vw - 24px);max-height:70vh;overflow:auto;background:#181C1F;border:1px solid var(--line);border-radius:8px;padding:8px;box-shadow:0 8px 24px rgba(0,0,0,.45);display:grid;gap:4px}
.mmenu>p{margin:2px 6px 4px}
.mitem{display:grid;gap:2px;text-align:left;background:none;border:1px solid transparent;border-radius:6px;padding:8px 10px;color:inherit;cursor:pointer}
.mitem:hover{background:var(--sunk)}.mitem.on{border-color:var(--gold-lo)}.mitem.acctitem{border-top:1px solid var(--line);border-radius:0 0 6px 6px}
.mono{font-family:ui-monospace,Menlo,monospace;letter-spacing:.08em}
.clist li.used{opacity:.7}
.acct-admin{border:1px solid var(--line);border-radius:6px;padding:12px 16px}.acct-admin summary{cursor:pointer}.acct-admin .card{margin-top:10px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--card,#222);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:13px;z-index:50;max-width:90vw}
.sline .tag{margin-right:4px}
.sdetail{border-top:1px solid var(--line);padding:10px 0}.sdetail:first-of-type{border-top:0;padding-top:2px}
.sd-e{margin:6px 0}
.note{white-space:pre-wrap;background:var(--sunk);border-left:2px solid var(--gold-lo);padding:6px 9px;border-radius:4px;font-size:13px;margin:6px 0}
.media{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.thumb{position:relative;width:76px;height:76px;border-radius:6px;overflow:hidden;background:var(--sunk);border:1px solid var(--line)}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;cursor:zoom-in;display:block}
.thumb .ph{display:flex;align-items:center;justify-content:center;height:100%;font-size:11px;color:var(--muted)}
.thumb .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;font-size:18px;text-shadow:0 0 6px #000;pointer-events:none}
.thumb .x{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.65);color:#fff;border-radius:50%;width:22px;height:22px;line-height:20px;padding:0}
.viewer{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
.viewer img,.viewer video{max-width:100%;max-height:80vh;border-radius:6px}
.mpick{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:6px}
.mpick label.btn{cursor:pointer}
.chip.tog{border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;padding:5px 11px;font-size:12.5px}
.chip.tog.on{border-color:var(--gold-lo);background:var(--accent-soft);color:var(--gold-hi);font-weight:700}
.chip.t{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--gold-lo);background:var(--accent-soft);color:var(--gold-hi)}
.chip.t .x{width:18px;height:18px;line-height:16px;padding:0;font-size:13px}
.field>.chips{margin-top:2px}
.codes{display:grid;gap:8px;margin-bottom:8px}
.codes>div{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.codes b{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:17px;letter-spacing:1.5px;color:var(--gold-hi);flex:1;min-width:120px}
.codes .muted{width:100%}
.assign{border-top:1px solid var(--line);padding:9px 0}
.assign-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}.assign-h b{flex:1}
.assign-add{width:auto;padding:4px 8px;font-size:12.5px}
.bulk{border:1px solid var(--line);border-radius:12px;padding:10px;margin:10px 0;display:grid;gap:8px}
div.pick:not(.kv3>div){display:grid;gap:8px;margin-top:6px}
.pick-bar{display:grid;gap:6px}
.pick-list{list-style:none;margin:0;padding:0;max-height:320px;overflow-y:auto;border:1px solid var(--line);border-radius:10px}
.pick-list li{border-bottom:1px solid var(--line)}.pick-list li:last-child{border-bottom:0}
.pick-list .check{padding:9px 10px;flex-wrap:nowrap}
.pick-list .check span{flex:1;min-width:0}
.pick-list .check small{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.check.small{font-size:13px}.check.small input{width:18px;height:18px}
.search{width:100%;margin:6px 0}
.rv-i{border-top:1px solid var(--line);padding:8px 0}
.nw{white-space:nowrap}
.term{cursor:pointer;border-bottom:1px dotted color-mix(in srgb,currentColor 70%,transparent);-webkit-tap-highlight-color:transparent;padding-bottom:0;text-decoration:none}
.term.on{color:var(--gold-hi);border-bottom-color:var(--gold-hi)}
.termpop{position:fixed;z-index:1000;background:#1B2025;border:1px solid var(--accent);border-radius:10px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.55);font-size:13.5px;line-height:1.55;color:var(--fg);text-align:left;font-weight:400;font-family:var(--f-body);letter-spacing:0;white-space:normal;animation:tp .12s ease-out}
.termpop b{display:block;color:var(--gold);font-size:13.5px;margin-bottom:4px}
.termpop p{margin:0 0 8px}
.termpop a{color:var(--gold-hi);font-size:12.5px;text-decoration:underline;text-underline-offset:3px}
@keyframes tp{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.zstrip{grid-template-columns:repeat(5,minmax(0,1fr))}.zstrip span{white-space:nowrap;letter-spacing:-.3px}
.kv3 b{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:2px;white-space:nowrap;font-size:clamp(16px,5.2vw,23px);font-weight:700;letter-spacing:-.02em}.kv3 b small{font-size:11.5px;font-weight:500;color:var(--muted);letter-spacing:0}
.mrat{flex-wrap:nowrap;gap:6px}.mrat span{white-space:nowrap}
@media (max-width:359px){.zstrip span{font-size:10px}.mrat{font-size:12px}}
.top>.row{flex-wrap:nowrap;flex:0 1 auto}.top .actchip{min-width:0;flex:0 1 auto}.top .icon.acct{flex:none}.top .brand{flex:none}
@media (max-width:360px){.top .actchip{max-width:118px}}
.dg{font-family:var(--f-num);font-weight:700;letter-spacing:0}
</style>
